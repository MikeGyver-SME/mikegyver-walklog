name: Build and upload WalkLog to TestFlight
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read

# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   ASC_KEY_ID     App Store Connect API key ID (e.g. A1B2C3D4E5)
#   ASC_ISSUER_ID  Issuer ID (UUID from the API key page)
#   ASC_KEY_P8     Full contents of the downloaded AuthKey_XXXX.p8 file
#   TEAM_ID        Your Apple Developer Team ID (Membership details page)
#
# Signing strategy: xcodebuild's -allowProvisioningUpdates does not pick up
# API-key auth on Xcode 26 ("No Account for Team"), so fastlane drives
# signing instead: `cert` mints the Apple Distribution certificate and
# `sigh` fetches the App Store provisioning profile, then xcodebuild
# archives with manual signing. The API key itself was verified valid
# (HTTP 200 against api.appstoreconnect.apple.com).
jobs:
  build:
    runs-on: macos-26
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      TEAM_ID: ${{ secrets.TEAM_ID }}
      BUNDLE_ID: studio.mikegyver.walklog
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: ios
        run: xcodegen generate

      - name: Write App Store Connect API key
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          # Trailing newline: some PEM parsers reject a key file without one.
          printf '%s\n' '${{ secrets.ASC_KEY_P8 }}' > "$RUNNER_TEMP/asc/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/asc/AuthKey.p8"

      - name: Validate API key
        run: |
          KEY="$RUNNER_TEMP/asc/AuthKey.p8"
          echo "Key ID: $ASC_KEY_ID"
          echo "Issuer ID: $ASC_ISSUER_ID"
          [ -n "$ASC_KEY_ID" ] || { echo "::error::ASC_KEY_ID secret is empty."; exit 1; }
          [ -n "$ASC_ISSUER_ID" ] || { echo "::error::ASC_ISSUER_ID secret is empty."; exit 1; }
          [ -n "$TEAM_ID" ] || { echo "::error::TEAM_ID secret is empty."; exit 1; }
          head -1 "$KEY" | grep -q "BEGIN PRIVATE KEY" || { echo "::error::ASC_KEY_P8 is malformed: missing BEGIN PRIVATE KEY header. Re-paste the .p8 file into the secret."; exit 1; }
          tail -1 "$KEY" | grep -q "END PRIVATE KEY" || { echo "::error::ASC_KEY_P8 is malformed: missing END PRIVATE KEY footer. Re-paste the .p8 file into the secret."; exit 1; }
          echo "API key file OK ($(wc -l < "$KEY") lines)."

      - name: Install fastlane
        run: sudo gem install fastlane -N

      - name: Create signing keychain
        run: |
          KEYCHAIN="$RUNNER_TEMP/walklog.keychain-db"
          PASSWORD="$(openssl rand -base64 32)"
          echo "WALKLOG_KEYCHAIN_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
          echo "WALKLOG_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          security create-keychain -p "$PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" "$HOME/Library/Keychains/login.keychain-db"
          security default-keychain -s "$KEYCHAIN"
          echo "Keychain ready: $KEYCHAIN"

      - name: Write API key JSON for fastlane
        run: |
          python3 - <<'PY'
          import os, json
          with open(os.path.join(os.environ['RUNNER_TEMP'], 'asc', 'AuthKey.p8')) as f:
              p8 = f.read()
          key = {
              "key_id": os.environ["ASC_KEY_ID"],
              "issuer_id": os.environ["ASC_ISSUER_ID"],
              "key": p8,
              "in_house": False,
          }
          with open(os.path.join(os.environ['RUNNER_TEMP'], 'asc_key.json'), 'w') as f:
              json.dump(key, f)
          print('API key JSON written')
          PY

      - name: Create distribution certificate and provisioning profile
        run: |
          mkdir -p "$RUNNER_TEMP/certs" "$RUNNER_TEMP/profiles"
          # --force: revoke any orphaned cert whose private key is lost
          # (e.g. created on a previous ephemeral runner) and mint fresh.
          fastlane cert --api_key_path "$RUNNER_TEMP/asc_key.json" \
            --output_path "$RUNNER_TEMP/certs" \
            --keychain_path "$WALKLOG_KEYCHAIN" \
            --keychain_password "$WALKLOG_KEYCHAIN_PASSWORD" \
            --force
          fastlane sigh --api_key_path "$RUNNER_TEMP/asc_key.json" \
            --app_identifier "$BUNDLE_ID" \
            --output_path "$RUNNER_TEMP/profiles" --force
          PROFILE_PATH=$(ls "$RUNNER_TEMP/profiles"/*.mobileprovision | head -1)
          echo "Profile file: $PROFILE_PATH"
          PLIST=$(security cms -D -i "$PROFILE_PATH")
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /dev/stdin <<< "$PLIST")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' /dev/stdin <<< "$PLIST")
          echo "Profile UUID: $PROFILE_UUID"
          echo "Profile name: $PROFILE_NAME"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"

      - name: Verify signing identity
        run: |
          echo "Identities with private keys in the CI keychain:"
          security find-identity -v -p codesigning "$WALKLOG_KEYCHAIN"

      - name: Archive (manual signing)
        working-directory: ios
        run: |
          xcodebuild -project WalkLog.xcodeproj -scheme WalkLog -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/WalkLog.xcarchive" archive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            DEVELOPMENT_TEAM="$TEAM_ID"

      - name: Write export options
        run: |
          python3 - <<'PY'
          import os, plistlib
          opts = {
              'method': 'app-store',
              'teamID': os.environ['TEAM_ID'],
              'signingStyle': 'manual',
              'provisioningProfiles': {
                  os.environ['BUNDLE_ID']: os.environ['PROFILE_UUID'],
              },
              'uploadSymbols': True,
          }
          with open(os.path.join(os.environ['RUNNER_TEMP'], 'exportOptions.plist'), 'wb') as f:
              plistlib.dump(opts, f)
          print('exportOptions.plist written (manual signing)')
          PY

      - name: Export IPA
        working-directory: ios
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/WalkLog.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/exportOptions.plist"
          ls -la "$RUNNER_TEMP/export"

      - name: Upload to TestFlight
        run: |
          fastlane pilot upload \
            --ipa "$RUNNER_TEMP/export/WalkLog.ipa" \
            --api_key_path "$RUNNER_TEMP/asc_key.json" \
            --skip_submission \
            --skip_waiting_for_build_processing

      - name: Keep a copy of the IPA
        uses: actions/upload-artifact@v4
        with:
          name: WalkLog-ipa
          path: ${{ runner.temp }}/export/WalkLog.ipa
          retention-days: 14
